async function unzipSimple(buf){const u8=new Uint8Array(buf);const view=new DataView(buf);const files={};let eocd=-1;for(let i=u8.length-22;i>=0;i--){if(view.getUint32(i,true)===0x06054b50){eocd=i;break}}if(eocd<0)return files;const total=view.getUint16(eocd+10,true);let offset=view.getUint32(eocd+16,true);for(let i=0;i<total;i++){if(view.getUint32(offset,true)!==0x02014b50)break;const comp=view.getUint16(offset+10,true);const csize=view.getUint32(offset+20,true);const nlen=view.getUint16(offset+28,true);const elen=view.getUint16(offset+30,true);const clen=view.getUint16(offset+32,true);const name=new TextDecoder().decode(u8.subarray(offset+46,offset+46+nlen));const lhoff=view.getUint32(offset+42,true);offset+=46+nlen+elen+clen;if(view.getUint32(lhoff,true)!==0x04034b50)continue;const lnlen=view.getUint16(lhoff+26,true);const lelen=view.getUint16(lhoff+28,true);const dataStart=lhoff+30+lnlen+lelen;const data=u8.subarray(dataStart,dataStart+csize);if(comp===0)files[name]=data;else if(comp===8){try{const ds=new DecompressionStream("deflate-raw");const stream=new Blob([data]).stream().pipeThrough(ds);const ab=await new Response(stream).arrayBuffer();files[name]=new Uint8Array(ab)}catch{}}}return files}

function analyze(raw){const t=raw.replace(/\r/g,""),lo=t.toLowerCase(),lines=t.split("\n").map(s=>s.trim()).filter(Boolean);
