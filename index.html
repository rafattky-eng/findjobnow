<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FindJob Now">
<meta name="theme-color" content="#071B35">
<meta name="description" content="Career intelligence for Japan. Tokyo-focused, foreigner-friendly. Upload resume, set target in 6 questions, get DNA, jobs, culture & visa tools. Rule-based, private, no sign-up.">
<meta name="application-name" content="FindJob Now">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; worker-src 'self' blob: https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://remotive.com https://jobicy.com https://boards-api.greenhouse.io https://api.lever.co https://api.ashbyhq.com; object-src 'none'; base-uri 'self'; form-action 'self' mailto:; upgrade-insecure-requests">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="stylesheet" href="./styles.css">
<title>FindJob Now — Japan Career Intelligence</title>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="logo" id="logoHome" role="button" tabindex="0" title="Home">
      <img src="./icon-192.png" alt="FindJob Now" class="logo-img" width="32" height="32">
      FindJob Now
    </div>
    <div class="header-actions">
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" id="btnEn" class="active" aria-pressed="true">EN</button>
        <button type="button" id="btnJp" aria-pressed="false">JP</button>
      </div>
      <button class="icon-btn" id="btnRestart" type="button" aria-label="Start over" title="Start over">🔄</button>
      <button class="icon-btn" id="btnBackup" type="button" aria-label="Backup" title="Backup (long-press to restore)">💾</button>
    </div>
  </header>

  <div class="progress-wrap hidden" id="progressWrap" aria-hidden="true">
    <div class="progress-meta">
      <span id="stepLabel">Step 1 of 6</span>
      <span id="stepName">Career Target</span>
    </div>
    <div class="progress-track"><i id="progressFill" style="width:16%"></i></div>
  </div>

  <main id="main" role="main"></main>

  <nav class="nav-bottom" id="bottomNav" aria-label="Main">
    <button type="button" data-view="dashboard" class="active" aria-label="Home">
      <span aria-hidden="true">🧭</span><span class="nav-label">Home</span>
    </button>
    <button type="button" data-view="jobs" aria-label="Jobs">
      <span aria-hidden="true">💼</span><span class="nav-label">Jobs</span>
    </button>
    <button type="button" data-view="tools" aria-label="Tools">
      <span aria-hidden="true">🧰</span><span class="nav-label">Tools</span>
    </button>
    <button type="button" data-view="tracker" aria-label="Tracker">
      <span aria-hidden="true">🗂</span><span class="nav-label">Tracker</span>
    </button>
  </nav>
  <footer class="app-footer" id="appFooter">
    <div>© 2026 Rafat Kotaki. All rights reserved.</div>
    <div>FindJob Now · v7.2.0</div>
  </footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="./storage.js"></script>
<script src="./i18n.js"></script>
<script src="./japan-data.js"></script>
<script src="./dna-engine.js"></script>
<script src="./jobs.js"></script>
<script src="./tools.js"></script>
<script src="./tracker.js"></script>
<script src="./app.js"></script>
</body>
</html>
